name: Build Porter Auto Accept APK

on:
  workflow_dispatch:
  push:
    branches: [ porter-auto-accept ]
    paths:
      - 'porter-auto-accept/**'
      - '.github/workflows/porter-auto-accept.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        working-directory: porter-auto-accept
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: porter-auto-accept-debug
          path: porter-auto-accept/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
